spring.application.name=wearwise
server.port=${SERVER_PORT:8080}

# Nạp secret cục bộ (API key) từ file KHÔNG commit lên git.
# Xem application-secrets.properties.example để biết cách điền.
spring.config.import=optional:application-secrets.properties

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wearwise_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wearwise_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wearwise_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

wearwise.console.enabled=${WEARWISE_CONSOLE_ENABLED:false}
wearwise.seed.enabled=${WEARWISE_SEED_ENABLED:false}
# === Xác thực / JWT ===
# Khóa ký JWT HS256 — tối thiểu 32 ký tự. BẮT BUỘC đổi khi triển khai thật.
wearwise.auth.token-secret=${WEARWISE_AUTH_TOKEN_SECRET:wearwise-local-development-secret-change-me-32chars}
# Access token ngắn hạn (15 phút); phiên dài được duy trì bằng refresh token.
wearwise.auth.token-expires-in-seconds=${WEARWISE_AUTH_TOKEN_EXPIRES_IN_SECONDS:900}
# Refresh token 7 ngày, xoay vòng sau mỗi lần dùng.
wearwise.auth.refresh-token-expires-in-seconds=${WEARWISE_AUTH_REFRESH_TOKEN_EXPIRES_IN_SECONDS:604800}
# Chống dò mật khẩu: sai 5 lần thì khóa tài khoản 15 phút.
wearwise.auth.max-failed-login-attempts=${WEARWISE_AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
wearwise.auth.lock-duration-seconds=${WEARWISE_AUTH_LOCK_DURATION_SECONDS:900}
# Link đặt lại mật khẩu sống 30 phút, tối đa 5 yêu cầu/giờ cho mỗi tài khoản.
wearwise.auth.password-reset-expires-in-seconds=${WEARWISE_AUTH_PASSWORD_RESET_EXPIRES_IN_SECONDS:1800}
wearwise.auth.password-reset-max-requests-per-hour=${WEARWISE_AUTH_PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:5}

# === Email đặt lại mật khẩu ===
# KHÔNG khai báo spring.mail.host ở đây: chưa cấu hình SMTP thì AuthMailService ghi link
# đặt lại ra log thay vì gửi mail — chạy được ngay khi dev. Muốn gửi mail thật, điền
# spring.mail.* trong application-secrets.properties (xem file .example).
wearwise.mail.from=${MAIL_FROM:no-reply@wearwise.local}
# Link trong email trỏ về trang đặt lại mật khẩu của frontend.
wearwise.mail.reset-url-base=${MAIL_RESET_URL_BASE:http://localhost:5173/reset-password}

# Tải ảnh (multipart) — ảnh thử đồ tối đa 10MB
spring.servlet.multipart.max-file-size=${WEARWISE_MAX_UPLOAD_SIZE:12MB}
spring.servlet.multipart.max-request-size=${WEARWISE_MAX_UPLOAD_SIZE:12MB}

# === API KEY dịch vụ ngoài — KHÔNG hardcode ở đây ===
# Điền giá trị thật vào application-secrets.properties (đã gitignore) hoặc biến môi trường.
# File này chỉ khai báo tên property với default TRỐNG để không lộ secret khi commit.

# Cloudinary: nơi lưu ảnh, DB chỉ lưu URL.
wearwise.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
wearwise.cloudinary.api-key=${CLOUDINARY_API_KEY:}
wearwise.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
wearwise.cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:wearwise}

# Dịch vụ thử đồ ảo: tryon-api.com — ghép trang phục lên ảnh người dùng.
wearwise.tryon.api-key=${TRYON_API_KEY:}
wearwise.tryon.base-url=${TRYON_API_BASE_URL:https://tryon-api.com/api/v1}
# model: "auto" để gateway tự chọn; hoặc slug cụ thể — xem https://tryon-api.com/models.html
wearwise.tryon.model=${TRYON_API_MODEL:auto}
wearwise.tryon.category=${TRYON_API_CATEGORY:apparel}

# Google Gemini: gợi ý phối đồ AI theo thời tiết + tone màu.
wearwise.gemini.api-key=${GEMINI_API_KEY:}
wearwise.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
wearwise.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
