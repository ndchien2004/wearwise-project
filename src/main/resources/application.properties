spring.application.name=wearwise
server.port=${SERVER_PORT:8080}

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wearwise_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wearwise_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wearwise_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

wearwise.console.enabled=${WEARWISE_CONSOLE_ENABLED:false}
wearwise.seed.enabled=${WEARWISE_SEED_ENABLED:false}
