spring.application.name=wearwise
server.port=${SERVER_PORT:8080}

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wearwise_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wearwise_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wearwise_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

wearwise.console.enabled=${WEARWISE_CONSOLE_ENABLED:false}
wearwise.seed.enabled=${WEARWISE_SEED_ENABLED:false}
wearwise.auth.token-secret=${WEARWISE_AUTH_TOKEN_SECRET:wearwise-local-development-secret-change-me-32chars}
wearwise.auth.token-expires-in-seconds=${WEARWISE_AUTH_TOKEN_EXPIRES_IN_SECONDS:86400}

# Tải ảnh (multipart) — ảnh thử đồ tối đa 10MB
spring.servlet.multipart.max-file-size=${WEARWISE_MAX_UPLOAD_SIZE:12MB}
spring.servlet.multipart.max-request-size=${WEARWISE_MAX_UPLOAD_SIZE:12MB}

# === Thử đồ ảo — điền API key thủ công vào đây (hoặc qua biến môi trường) ===
# Cloudinary: nơi lưu ảnh, DB chỉ lưu URL. Lấy từ Dashboard > Product Environment Credentials.
wearwise.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dzwimbvjh}
wearwise.cloudinary.api-key=${CLOUDINARY_API_KEY:224522552679923}
wearwise.cloudinary.api-secret=${CLOUDINARY_API_SECRET:DInU_XZeB-N_XZxqe03Y1mBMzLs}
wearwise.cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:wearwise}

# Dịch vụ thử đồ ảo: tryon-api.com — ghép trang phục lên ảnh người dùng.
# Chỉ cần điền api-key (dạng "tryon_..."). Lấy tại https://tryon-api.com
wearwise.tryon.api-key=${TRYON_API_KEY:tryon_94c96a6982d4d11cfcf18bbe9d451c94ed38bea09fad2f06}
wearwise.tryon.base-url=${TRYON_API_BASE_URL:https://tryon-api.com/api/v1}
# model: "auto" để gateway tự chọn model phù hợp; hoặc chỉ định slug cụ thể
# (vd kling/kolors-v1-5, wearfits/tryon-clothing) — xem https://tryon-api.com/models.html
wearwise.tryon.model=${TRYON_API_MODEL:auto}
wearwise.tryon.category=${TRYON_API_CATEGORY:apparel}
