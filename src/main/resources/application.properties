spring.application.name=wearwise
server.port=${SERVER_PORT:8080}

# Nạp secret cục bộ (API key) từ file KHÔNG commit lên git.
# Xem application-secrets.properties.example để biết cách điền.
spring.config.import=optional:application-secrets.properties

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wearwise_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wearwise_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wearwise_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Flyway: cấu trúc bảng do file migration quyết định ===
# Trước đây Hibernate tự sửa bảng bằng ddl-auto=update. Cách đó không có lịch sử, không lùi lại
# được, không bao giờ xóa/đổi cột thừa (schema trôi dần khỏi entity mà không ai biết), và hai
# instance khởi động cùng lúc có thể tranh nhau ALTER TABLE.
# Giờ mọi thay đổi nằm ở src/main/resources/db/migration/V<n>__mo_ta.sql, chạy đúng một lần và
# được ghi lại trong bảng flyway_schema_history.
spring.flyway.enabled=true
# Database đã có sẵn dữ liệu từ trước Flyway: đánh dấu V1 là đã áp dụng thay vì cố tạo lại bảng.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate / JPA
# validate (không phải update): Hibernate chỉ đối chiếu entity với schema và báo lỗi ngay lúc
# khởi động nếu lệch — nó không còn quyền tự ý sửa cấu trúc database nữa.
spring.jpa.hibernate.ddl-auto=validate
# show-sql/format_sql chuyển sang application-dev.properties: ở production chúng vừa tốn I/O
# vừa ghi thẳng dữ liệu người dùng ra log.
spring.jpa.open-in-view=false

wearwise.console.enabled=${WEARWISE_CONSOLE_ENABLED:false}
wearwise.seed.enabled=${WEARWISE_SEED_ENABLED:false}
# === CORS ===
# Domain của frontend được phép gọi API, phân tách bằng dấu phẩy. Khi deploy frontend lên
# Cloudflare Pages phải bổ sung domain đó, vd:
# WEARWISE_CORS_ALLOWED_ORIGINS=https://wearwise.pages.dev,https://*.wearwise.pages.dev
wearwise.cors.allowed-origins=${WEARWISE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# === Giới hạn tần suất (chống lạm dụng tầng ứng dụng, KHÔNG phải chống DDoS) ===
# AI tính theo giờ vì mỗi lượt gọi tốn quota thật; xác thực và phần còn lại tính theo phút.
# Đặt 0 để tắt giới hạn của nhóm tương ứng.
wearwise.ratelimit.ai-per-hour=${WEARWISE_RATELIMIT_AI_PER_HOUR:40}
# Thử đồ ảo (tryon-api.com) gọi dịch vụ trả phí theo từng lượt; tải ảnh chiếm dung lượng
# Cloudinary vĩnh viễn. Cả hai đều là dịch vụ trả tiền nên tính theo giờ như AI — để chúng ở
# hạn mức GENERAL đồng nghĩa cho phép ~240 lượt/phút.
wearwise.ratelimit.try-on-per-hour=${WEARWISE_RATELIMIT_TRY_ON_PER_HOUR:15}
wearwise.ratelimit.upload-per-hour=${WEARWISE_RATELIMIT_UPLOAD_PER_HOUR:80}
wearwise.ratelimit.auth-per-minute=${WEARWISE_RATELIMIT_AUTH_PER_MINUTE:20}
wearwise.ratelimit.general-per-minute=${WEARWISE_RATELIMIT_GENERAL_PER_MINUTE:240}
# BẬT khi backend đứng sau proxy (Cloudflare, Nginx) để lấy đúng IP người dùng.
# Để false khi server phơi thẳng ra Internet: tin header lúc đó là tự mở đường lách giới hạn.
wearwise.ratelimit.trust-forwarded-header=${WEARWISE_RATELIMIT_TRUST_FORWARDED:false}

# === Xác thực / JWT ===
# Khóa ký JWT HS256 — tối thiểu 32 ký tự. KHÔNG có giá trị mặc định: thiếu biến môi trường thì
# ứng dụng từ chối khởi động (xem AuthTokenService), vì chạy bằng một khóa nằm sẵn trong git
# đồng nghĩa ai cũng tự phát hành được token cho mọi tài khoản.
# Sinh khóa mới:  openssl rand -base64 48
# Khi phát triển cục bộ, profile 'dev' đã có sẵn khóa dùng chung — xem application-dev.properties.
wearwise.auth.token-secret=${WEARWISE_AUTH_TOKEN_SECRET:}
# Access token ngắn hạn (15 phút); phiên dài được duy trì bằng refresh token.
wearwise.auth.token-expires-in-seconds=${WEARWISE_AUTH_TOKEN_EXPIRES_IN_SECONDS:900}
# Refresh token 7 ngày, xoay vòng sau mỗi lần dùng.
wearwise.auth.refresh-token-expires-in-seconds=${WEARWISE_AUTH_REFRESH_TOKEN_EXPIRES_IN_SECONDS:604800}

# Refresh token đi bằng cookie HttpOnly (JavaScript không đọc được) thay vì nằm trong localStorage.
# Hai thiết lập dưới đây phụ thuộc cách triển khai:
#
#   Frontend và backend CÙNG site (dev qua Vite proxy, hoặc backend phục vụ luôn file tĩnh):
#       same-site=Lax, secure=false   ← mặc định, chạy được ngay
#
#   Frontend và backend KHÁC site (Cloudflare Pages + domain API riêng):
#       same-site=None, secure=true   ← BẮT BUỘC, vì trình duyệt không gửi cookie Lax sang site khác.
#       SameSite=None mà thiếu Secure thì ứng dụng từ chối khởi động (backend phải chạy HTTPS).
wearwise.auth.refresh-cookie-same-site=${WEARWISE_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
wearwise.auth.refresh-cookie-secure=${WEARWISE_AUTH_REFRESH_COOKIE_SECURE:false}
# Chống dò mật khẩu: sai 5 lần thì khóa tài khoản 15 phút.
wearwise.auth.max-failed-login-attempts=${WEARWISE_AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
wearwise.auth.lock-duration-seconds=${WEARWISE_AUTH_LOCK_DURATION_SECONDS:900}
# Link đặt lại mật khẩu sống 30 phút, tối đa 5 yêu cầu/giờ cho mỗi tài khoản.
wearwise.auth.password-reset-expires-in-seconds=${WEARWISE_AUTH_PASSWORD_RESET_EXPIRES_IN_SECONDS:1800}
wearwise.auth.password-reset-max-requests-per-hour=${WEARWISE_AUTH_PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:5}

# Đăng ký có xác thực OTP qua email: thời hạn mã, giới hạn số lần xin mã và số lần nhập sai.
wearwise.auth.registration-otp-expires-in-seconds=${WEARWISE_AUTH_REGISTRATION_OTP_EXPIRES_IN_SECONDS:600}
wearwise.auth.registration-otp-max-requests-per-hour=${WEARWISE_AUTH_REGISTRATION_OTP_MAX_REQUESTS_PER_HOUR:5}
wearwise.auth.registration-otp-max-attempts=${WEARWISE_AUTH_REGISTRATION_OTP_MAX_ATTEMPTS:5}

# === Email đặt lại mật khẩu ===
# KHÔNG khai báo spring.mail.host ở đây: chưa cấu hình SMTP thì AuthMailService ghi link
# đặt lại ra log thay vì gửi mail — chạy được ngay khi dev. Muốn gửi mail thật, điền
# spring.mail.* trong application-secrets.properties (xem file .example).
wearwise.mail.from=${MAIL_FROM:no-reply@wearwise.local}
# Link trong email trỏ về trang đặt lại mật khẩu của frontend.
wearwise.mail.reset-url-base=${MAIL_RESET_URL_BASE:http://localhost:5173/reset-password}

# Tải ảnh (multipart) — ảnh thử đồ tối đa 10MB
spring.servlet.multipart.max-file-size=${WEARWISE_MAX_UPLOAD_SIZE:12MB}
spring.servlet.multipart.max-request-size=${WEARWISE_MAX_UPLOAD_SIZE:12MB}

# === API KEY dịch vụ ngoài — KHÔNG hardcode ở đây ===
# Điền giá trị thật vào application-secrets.properties (đã gitignore) hoặc biến môi trường.
# File này chỉ khai báo tên property với default TRỐNG để không lộ secret khi commit.

# Cloudinary: nơi lưu ảnh, DB chỉ lưu URL.
wearwise.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
wearwise.cloudinary.api-key=${CLOUDINARY_API_KEY:}
wearwise.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
wearwise.cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:wearwise}

# Dịch vụ thử đồ ảo: tryon-api.com — ghép trang phục lên ảnh người dùng.
wearwise.tryon.api-key=${TRYON_API_KEY:}
# Model sinh ảnh của Gemini (dùng khi muốn thử nhà cung cấp thay thế — xem GeminiImageClient).
# LƯU Ý: phải là bản có hậu tố -image; model text như gemini-3.1-flash-lite KHÔNG sinh được ảnh.
# Và phải bật thanh toán cho project Google AI: gói miễn phí có hạn mức bằng 0 cho model ảnh.
# Rẻ→đắt: gemini-3.1-flash-lite-image < gemini-3.1-flash-image < gemini-3-pro-image
wearwise.gemini.image-model=${GEMINI_IMAGE_MODEL:gemini-3.1-flash-lite-image}
wearwise.tryon.base-url=${TRYON_API_BASE_URL:https://tryon-api.com/api/v1}
# model: "auto" để gateway tự chọn; hoặc slug cụ thể — xem https://tryon-api.com/models.html
wearwise.tryon.model=${TRYON_API_MODEL:auto}
wearwise.tryon.category=${TRYON_API_CATEGORY:apparel}

# Google Gemini: gợi ý phối đồ AI theo thời tiết + tone màu.
wearwise.gemini.api-key=${GEMINI_API_KEY:}
wearwise.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
# gemini-2.5-flash đã bị Google ngừng cấp cho người dùng mới (trả HTTP 404).
wearwise.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
