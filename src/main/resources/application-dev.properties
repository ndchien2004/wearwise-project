# Cấu hình chỉ dành cho máy lập trình viên. Kích hoạt bằng một trong hai cách:
#   ./mvnw spring-boot:run            (plugin đã bật sẵn profile dev — xem pom.xml)
#   java -jar app.jar --spring.profiles.active=dev
#
# TUYỆT ĐỐI không bật profile này khi triển khai thật: khóa ký bên dưới nằm công khai
# trong git, ai đọc được repo cũng tự phát hành được token cho bất kỳ tài khoản nào.
# Bản đóng gói chạy bằng `java -jar` không có profile nào, nên nếu quên đặt
# WEARWISE_AUTH_TOKEN_SECRET thì ứng dụng sẽ báo lỗi và dừng ngay — đó là chủ đích.
#
# Giá trị này phải TRÙNG KHÍT với hằng số AuthTokenService.DEV_ONLY_SECRET, vì chốt an toàn
# "khóa dev bị dùng ngoài profile dev/test/local" so sánh đúng theo chuỗi. Trước đây hai bên
# lệch nhau nên chốt đó không bao giờ kích hoạt cho khóa thật đang dùng. Giờ đã có
# AuthTokenServiceTest.theDevKeyOnDiskMustMatchTheGuardedConstant() canh: đổi một bên mà quên
# bên kia là test đỏ ngay, không âm thầm mất tác dụng nữa.
#
# Chuỗi cố tình đọc ra được ý nghĩa thay vì trông như khóa ngẫu nhiên thật: nếu nó lỡ xuất hiện
# trong log hay bản cấu hình của môi trường thật, người đọc nhận ra ngay đây là khóa tạm.
wearwise.auth.token-secret=wearwise-local-development-secret-change-me-32chars

# Log SQL chỉ hữu ích lúc phát triển; ở production đây là chi phí I/O thật và làm lộ
# dữ liệu người dùng ra file log.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
