# Cấu hình chỉ dành cho máy lập trình viên. Kích hoạt bằng một trong hai cách:
#   ./mvnw spring-boot:run            (plugin đã bật sẵn profile dev — xem pom.xml)
#   java -jar app.jar --spring.profiles.active=dev
#
# TUYỆT ĐỐI không bật profile này khi triển khai thật: khóa ký bên dưới nằm công khai
# trong git, ai đọc được repo cũng tự phát hành được token cho bất kỳ tài khoản nào.
# Bản đóng gói chạy bằng `java -jar` không có profile nào, nên nếu quên đặt
# WEARWISE_AUTH_TOKEN_SECRET thì ứng dụng sẽ báo lỗi và dừng ngay — đó là chủ đích.
wearwise.auth.token-secret=8JYH+Arb9BRANWTs7vuSDuixnaHk7lLSB8WADwI5+YE=

# Log SQL chỉ hữu ích lúc phát triển; ở production đây là chi phí I/O thật và làm lộ
# dữ liệu người dùng ra file log.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
