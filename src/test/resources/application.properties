spring.datasource.url=jdbc:h2:mem:wearwise_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Test chạy trên H2 nên không dùng được migration viết cho MySQL (kiểu ENUM, cú pháp KEY...).
# Schema cho test do Hibernate dựng từ chính entity — đó cũng là thứ ta muốn kiểm chứng ở đây.
# Việc migration có khớp entity hay không được bảo đảm bởi ddl-auto=validate lúc chạy thật:
# lệch một cột là ứng dụng không khởi động được.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

wearwise.seed.enabled=false

# Cấu hình xác thực dùng cho test — cố định để không phụ thuộc giá trị mặc định.
wearwise.auth.token-secret=test-secret-with-enough-length-32
wearwise.auth.token-expires-in-seconds=900
wearwise.auth.refresh-token-expires-in-seconds=604800
wearwise.auth.max-failed-login-attempts=5
wearwise.auth.lock-duration-seconds=900
wearwise.auth.password-reset-expires-in-seconds=1800
wearwise.auth.password-reset-max-requests-per-hour=5

# Tắt giới hạn tần suất trong test: các test tích hợp bắn hàng chục request/giây từ cùng một
# "IP" nên sẽ bị chặn. Hành vi của bộ giới hạn được kiểm riêng ở RateLimiterTest.
wearwise.ratelimit.ai-per-hour=0
wearwise.ratelimit.external-per-hour=0
wearwise.ratelimit.auth-per-minute=0
wearwise.ratelimit.general-per-minute=0
